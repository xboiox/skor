name: skor

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skor}
      POSTGRES_DB: ${POSTGRES_DB:-skor}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skor}:${POSTGRES_PASSWORD:-skor}@db:5432/${POSTGRES_DB:-skor}
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-skor}:${POSTGRES_PASSWORD:-skor}@db:5432/${POSTGRES_DB:-skor}_test
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run dev -- --hostname 0.0.0.0"

  cleanup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-skor}
      PGPASSWORD: ${POSTGRES_PASSWORD:-skor}
      PGDATABASE: ${POSTGRES_DB:-skor}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-3600}
    volumes:
      - ./scripts/cleanup.sql:/cleanup.sql:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c 'while true; do
        psql -v ON_ERROR_STOP=1 -q -f /cleanup.sql || echo "cleanup failed";
        sleep $$CLEANUP_INTERVAL_SECONDS;
      done'

volumes:
  pgdata:
